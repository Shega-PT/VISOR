; ============================================================================
; VISOR — Sistema de Visão Computacional AERUS
; Configuração PlatformIO
; ============================================================================

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = espidf
monitor_speed = 115200

; PSRAM + Rust static library + Include paths
build_flags =
    -DCONFIG_ESP32_SPIRAM_SUPPORT=y
    -DCONFIG_SPIRAM_CACHE_WORKAROUND=y
    -DBOARD_HAS_PSRAM

; Componentes ESP-IDF e VISOR (esp32-camera via idf_component.yml)
lib_deps =
    file://components/visor_video

; Build Rust antes do PlatformIO
extra_scripts = pre:scripts/build_rust.py

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -I${PROJECT_DIR}/components/visor_video/include

lib_deps =
    file://components/visor_video

extra_scripts = pre:scripts/build_rust.py
