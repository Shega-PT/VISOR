; ============================================================================
; VISOR — Sistema de Visão Computacional AERUS
; Configuração PlatformIO
; ============================================================================

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = espidf
monitor_speed = 115200

; PSRAM + Rust static library + Include paths
build_flags =
    -DCONFIG_ESP32_SPIRAM_SUPPORT=y
    -DCONFIG_SPIRAM_CACHE_WORKAROUND=y
    -DBOARD_HAS_PSRAM
    -L${PROJECT_DIR}/rust/target/xtensa-esp32-espidf/release
    -lvisor_protocol
    -I${PROJECT_DIR}/lib/protocol_ffi/include

; Componentes ESP-IDF e VISOR
lib_deps =
    esp32-camera
    file://components/visor_video

; Build Rust antes do PlatformIO
extra_scripts = pre:scripts/build_rust.py

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -L${PROJECT_DIR}/rust/target/xtensa-esp32-espidf/release
    -lvisor_protocol
    -I${PROJECT_DIR}/lib/protocol_ffi/include
    -I${PROJECT_DIR}/components/visor_video/include
    ; Otimizações para memória reduzida (sem PSRAM)
    -DCONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=6
    -DCONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=6
    -DCONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=6
    -DCONFIG_LWIP_MAX_SOCKETS=6

lib_deps =
    file://components/visor_video

extra_scripts = pre:scripts/build_rust.py
