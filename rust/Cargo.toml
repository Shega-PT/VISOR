[package]
name = "visor-protocol"
version = "2.0.0"
edition = "2021"
authors = ["ShegaPT"]
description = "Protocolo TLV binário e Parser FSM para o módulo VISOR do sistema AERUS"
license = "GPL-3.0"

[lib]
crate-type = ["staticlib"]
name = "visor_protocol"
path = "src/lib.rs"

[dependencies]
esp-idf-sys = { version = "0.37", features = ["std"], optional = true }

[features]
default = ["std"]
std = ["esp-idf-sys"]
no-std = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
